# Test configuration for Mock Broker Adapter

# Exclude services from tests that need dependencies not available in this adapter module
quarkus.arc.exclude-types=ai.quorumtrading.application.service.MarketResearchOrchestrator,\
  ai.quorumtrading.application.service.ExecuteMarketResearchService

quarkus.log.level=INFO
quarkus.log.category."ai.quorumtrading".level=INFO

# Auto-backtest configuration for tests
%test.quorumtrading.auto-backtest.period-weeks=1
%test.quorumtrading.auto-backtest.initial-cash=100000.0
