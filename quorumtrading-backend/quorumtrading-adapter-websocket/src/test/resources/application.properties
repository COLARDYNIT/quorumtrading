# Exclude services and agents from WebSocket adapter tests (they need dependencies not available in this module)
quarkus.arc.exclude-types=ai.quorumtrading.application.orchestration.agents.TechnicalAgent,\
  ai.quorumtrading.application.orchestration.agents.FundamentalAgent,\
  ai.quorumtrading.application.orchestration.agents.SentimentAgent,\
  ai.quorumtrading.application.service.MarketResearchOrchestrator,\
  ai.quorumtrading.application.service.ExecuteMarketResearchService

# Hibernate ORM - ignore global JSON format mapper to avoid conflicts with Jackson configuration
quarkus.hibernate-orm.mapping.format.global=ignore

# Jackson - don't write dates as timestamps
quarkus.jackson.write-dates-as-timestamps=false

# Auto-backtest configuration for tests
%test.quorumtrading.auto-backtest.period-weeks=1
%test.quorumtrading.auto-backtest.initial-cash=100000.0
