# Alpaca Trading API REST Client Configuration

# Alpaca Broker Configuration
quorumtrading.broker.alpaca.enabled=${ALPACA_ENABLED:false}
quorumtrading.broker.alpaca.api-key=${ALPACA_API_KEY:}
quorumtrading.broker.alpaca.api-secret=${ALPACA_API_SECRET:}
quorumtrading.broker.alpaca.base-url=${ALPACA_BASE_URL:https://paper-api.alpaca.markets}

# REST Client configuration
quarkus.rest-client.alpaca-trading.url=${quorumtrading.broker.alpaca.base-url}
quarkus.rest-client.alpaca-trading.scope=jakarta.inject.Singleton
# Note: Headers are registered via @RegisterClientHeaders annotation on the client interface
