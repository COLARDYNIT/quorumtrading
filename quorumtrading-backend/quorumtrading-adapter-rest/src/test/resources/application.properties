# Test configuration for REST adapter

# Exclude types from tests (need adapters/producers not available in this module)
quarkus.arc.exclude-types=ai.quorumtrading.application.service.BrokerRouter,\
  com.quorumtrading.adapter.rest.resource.ChatResource

# Mirror the production request-body strictness (set in the bootstrap module's
# application.properties) so RequestBodyStrictnessTest exercises the real behaviour rather than
# this module's defaults.
quarkus.jackson.fail-on-unknown-properties=true

# Quarkus test configuration
quarkus.test.flat-class-path=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."ai.quorumtrading".level=DEBUG

# Auto-backtest configuration for tests
%test.quorumtrading.auto-backtest.period-weeks=1
%test.quorumtrading.auto-backtest.initial-cash=100000.0

# Database configuration (needed because persistence adapter dependency brings in Hibernate/JPA)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=quorumtrading
quarkus.datasource.password=dev-password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:55432/quorumtrading_test
quarkus.datasource.jdbc.max-size=10

# Hibernate
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=false
quarkus.hibernate-orm.mapping.format.global=ignore

# Auth configuration (required by AuthResource)
quorumtrading.auth.frontend-callback-url=http://localhost:3000/auth/callback

# LLM fallback configuration (required by ConfigResource)
quorumtrading.llm.openrouter.model.fallback=qwen/qwen3-4b:free,meta-llama/llama-3.3-70b-instruct,openai/gpt-4o-mini

# Credential encryption key (required by CredentialEncryptor)
quorumtrading.credentials.encryption-key=deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
