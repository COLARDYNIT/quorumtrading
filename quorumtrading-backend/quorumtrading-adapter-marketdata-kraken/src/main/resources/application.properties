# Kraken Market Data REST Client configuration.
#
# NOTE: the `enabled` flag lives in
# quorumtrading-bootstrap/src/main/resources/application.properties to avoid config conflicts.
# KEYLESS public market data — no credentials are sent.
quarkus.rest-client.kraken-api.url=https://api.kraken.com
quarkus.rest-client.kraken-api.scope=jakarta.inject.Singleton
