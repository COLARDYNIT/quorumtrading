# Test configuration for OpenRouter adapter
openrouter.api.key=test-key
openrouter.base.url=https://openrouter.ai/api/v1
openrouter.timeout=60s

# OpenRouter model fallback configuration
quorumtrading.llm.openrouter.model.fallback=qwen/qwen-2.5-coder-32b-instruct:free,meta-llama/llama-3.3-70b-instruct
quorumtrading.llm.openrouter.cache.initial-backoff-minutes=30
quorumtrading.llm.openrouter.cache.max-backoff-minutes=720

# Quarkus test configuration
quarkus.log.level=INFO
quarkus.log.category."ai.quorumtrading".level=INFO
# Exclude BrokerRouter from tests (needs broker adapters not available in this module)
quarkus.arc.exclude-types=ai.quorumtrading.application.service.BrokerRouter

# Auto-backtest configuration for tests
%test.quorumtrading.auto-backtest.period-weeks=1
%test.quorumtrading.auto-backtest.initial-cash=100000.0
