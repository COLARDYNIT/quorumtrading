# Test configuration for LocalLLMAdapter

# Default tool
quorumtrading.llm.local.default-tool=claude
quorumtrading.llm.local.tool.fallback=qwen,claude,codex,gemini
quorumtrading.llm.local.cache.initial-backoff-minutes=60
quorumtrading.llm.local.cache.max-backoff-minutes=1440

# Per-agent tool configuration
quorumtrading.agents.technical.llm-tool=codex
quorumtrading.agents.fundamental.llm-tool=gemini
quorumtrading.agents.sentiment.llm-tool=claude
quorumtrading.agents.risk.llm-tool=claude

# Exclude services from tests that need dependencies not available in this adapter module
quarkus.arc.exclude-types=ai.quorumtrading.application.service.BrokerRouter,\
  ai.quorumtrading.application.service.MarketResearchOrchestrator,\
  ai.quorumtrading.application.service.ExecuteMarketResearchService

# Auto-backtest configuration for tests
%test.quorumtrading.auto-backtest.period-weeks=1
%test.quorumtrading.auto-backtest.initial-cash=100000.0
