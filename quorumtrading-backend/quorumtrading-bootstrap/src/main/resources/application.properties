# Application
quarkus.application.name=quorumtrading
quarkus.banner.enabled=true

# Native image configuration
# Include prompt templates in native executable.
#
# app.properties is a ROOT-level resource inside unleash-client-java, read by
# UnleashProperties.<clinit> via ClassLoader.getResourceAsStream("app.properties"). It must be
# listed here because of the initialize-at-run-time below: deferring the package moves that
# static initializer out of the image build (where the real classpath is present) and into the
# running binary (where only embedded resources exist). Without it getResourceAsStream returns
# null, Properties.load(null) throws NPE, and every feature-flag evaluation dies with
# NoClassDefFoundError — which is exactly what took /api/v1/challenges, /api/v1/features and
# /api/v1/market-research down in production.
quarkus.native.resources.includes=prompts/**,app.properties
# Unleash holds a java.util.Random inside GradualRolloutRandomStrategy, and DefaultUnleash's
# static builtin-strategy list instantiates it — if any of that initializes at image-build time
# the instance lands in the image heap and native-image aborts (cached seeds). Class-level
# deferral was not enough (the static list constant-folds), so the whole SDK package is deferred
# to runtime initialization. SDK stays pinned at 8.4.0 — see CLAUDE.md.
quarkus.native.additional-build-args=--initialize-at-run-time=io.getunleash

# HTTP
quarkus.http.port=8080
%dev.quarkus.http.port=8085

# Proxy configuration (for ALB/reverse proxy in production)
# Enable forwarding of X-Forwarded-* headers from ALB to get correct scheme (https)
%prod.quarkus.http.proxy.proxy-address-forwarding=true
%prod.quarkus.http.proxy.enable-forwarded-host=true
# AWS ALB only sets X-Forwarded-* headers, never the RFC 7239 "Forwarded" header.
# Reject client-supplied Forwarded headers explicitly so they can't spoof addresses.
%prod.quarkus.http.proxy.allow-forwarded=false

# Security Headers
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin
quarkus.http.header."X-XSS-Protection".value=0
quarkus.http.header."Permissions-Policy".value=camera=(), microphone=(), geolocation=()
%prod.quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains

# CORS Configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:3100,http://localhost:8085,https://quorumtrading.com,https://api.quorumtrading.com
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=content-disposition
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=quorumtrading
quarkus.datasource.password=dev-password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:55432/quorumtrading
quarkus.datasource.jdbc.max-size=20

# Hibernate
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=false
# Fix JSON column format mapping conflict with Jackson (see ENTITYMANAGER_CROSS_MODULE_LIMITATION.md)
quarkus.hibernate-orm.mapping.format.global=ignore

# Flyway
# Migrations are owned by the persistence adapter module (quorumtrading-adapter-persistence)
# Flyway will automatically discover them on the classpath
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1

# OpenAPI / Swagger
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.store-schema-directory=openapi-spec
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.enabled=true
%prod.quarkus.swagger-ui.enabled=false
%prod.quarkus.swagger-ui.always-include=false

# Health
quarkus.smallrye-health.root-path=/q/health

# Logging
quarkus.log.level=WARN
quarkus.log.console.enabled=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.category."com.quorumtrading".level=INFO
quarkus.log.category."com.quorumtrading.application.service.ReachConsensusService".level=INFO
quarkus.log.category."com.quorumtrading.application.orchestration.agents".level=DEBUG
# OIDC debug logging (dev-only — noisy in production)
%dev.quarkus.log.category."io.quarkus.oidc".level=DEBUG
# Debug logging for adapters (troubleshooting)
quarkus.log.category."com.quorumtrading.adapter.llm".level=DEBUG
quarkus.log.category."com.quorumtrading.adapter.marketdata".level=DEBUG
quarkus.log.category."com.quorumtrading.application.service.BackfillExecutor".level=DEBUG
quarkus.log.category."com.quorumtrading.application.service.BackfillOrchestratorService".level=DEBUG

# Suppress SQL exception logging for constraint violations
# These are intentionally caught and handled by the application
# Note: Still logs at ERROR level, but won't show full stack traces
quarkus.log.category."org.hibernate.engine.jdbc.spi.SqlExceptionHelper".level=OFF

# File Logging
quarkus.log.file.enabled=true
quarkus.log.file.path=/tmp/quorumtrading.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd

# ===== Request body strictness =====
# Reject JSON request bodies carrying fields the DTO does not declare, instead of dropping them.
#
# Jackson ignores unknown properties by default, which makes a typo indistinguishable from a
# setting: POST /simulations with "intialCash": 5000 was accepted in full and then ran on the
# default, with nothing to tell the caller their value went nowhere. That is the same failure the
# strategy parser had with frontmatter keys, one layer up.
quarkus.jackson.fail-on-unknown-properties=true

# ===== Cache Configuration =====
# Model reliability stats: 1-hour TTL (data changes slowly, only on new LLM calls)
quarkus.cache.caffeine.model-reliability.expire-after-write=1H

# ===== Cost Estimation =====
# Average tokens per LLM consensus call (derived from production data: 21.5M tokens / 8K requests)
quorumtrading.cost-estimate.avg-prompt-tokens-per-call=2540
quorumtrading.cost-estimate.avg-completion-tokens-per-call=160

# ===== Welcome Budget =====
# Free AI credit (in cents) given to new users on first sign-up. Set to 0 to disable.
quorumtrading.user.welcome-budget-cents=200

# ===== Platform Markup =====
# Multiplier on raw LLM cost to produce the billed (user-facing) price. 1.0 means billed
# cost equals the provider's own price — the right value for a self-hosted install. A hosted
# deployment sets its commercial rate through the environment; the number is deployment
# configuration, not code.
quorumtrading.billing.markup-rate=${BILLING_MARKUP_RATE:1.0}

# ===== Free Model Rate Limiting =====
# Models that are free for users (platform absorbs cost), rate-limited per day
quorumtrading.free-model.ids=qwen/qwen3-coder:free,meta-llama/llama-3.3-8b-instruct:free
quorumtrading.free-model.daily-limit=50

# ===== Stripe Payment Configuration =====
# Enable Stripe integration for budget top-ups
quorumtrading.stripe.enabled=false
quorumtrading.stripe.secret-key=${STRIPE_SECRET_KEY:}
quorumtrading.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
quorumtrading.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
quorumtrading.stripe.currency=usd
quorumtrading.stripe.product-name=QuorumTrading AI Budget
quorumtrading.stripe.predefined-amounts=500,1000,2500,5000

# Production Stripe (enabled)
%prod.quorumtrading.stripe.enabled=true

# ===== System Model Defaults =====
# Default models for each trading context (based on 7 rounds of A/B testing, 20+ models)
# See ~/dev/ai/docs/llm-trading-model-analysis.md for full test results
#
# Key findings:
# - Mistral Small 24B: Best ROI - highest returns (+13.34%) at lowest cost (~$0.04/mo)
# - DeepSeek V3.2: GPT-5 class reasoning, best decision quality for orchestrator ($0.25/$0.38 per M)
# - Llama 4 Scout: Fast, reliable, valid JSON 4/4 tests ($0.08/$0.30 per M)
# - Claude Sonnet 4.5: Premium quality for live trading
# - AVOID: mistral-nemo, llama-3.3-70b (ignore position limits), claude-3-haiku (parse failures)
# - DEPRECATED: gemini-2.0-flash-001 sunsets March 31, 2026 — replaced by llama-4-scout
#
quorumtrading.llm.defaults.backtesting=mistralai/mistral-small-3.2-24b-instruct
quorumtrading.llm.defaults.paper-trading=meta-llama/llama-4-scout
quorumtrading.llm.defaults.live-trading=anthropic/claude-sonnet-4.6
quorumtrading.llm.defaults.research=mistralai/mistral-small-3.2-24b-instruct
quorumtrading.llm.defaults.chat=xiaomi/mimo-v2-flash

# Per-agent overrides: use a stronger model for the orchestrator (final decision-maker)
# DeepSeek V3.2 showed the best reasoning quality in benchmarks: nuanced HOLD for mixed signals,
# conservative risk assessment, well-calibrated quantities. ~5x cost but only for 1 of 5 agents.
quorumtrading.llm.defaults.backtesting.orchestrator=deepseek/deepseek-v3.2
quorumtrading.llm.defaults.paper-trading.orchestrator=deepseek/deepseek-v3.2
# NOTE: there is deliberately no ...defaults.research.orchestrator. Research has no orchestrator
# agent — its agents are NEWS_SENTIMENT_ANALYST, STRATEGY_DESIGNER and VIABILITY_ASSESSOR — so the
# key shipped here for months could never have had an effect. Per-agent research preferences now
# work through the ordinary chain (e.g. the RESEARCH_STRATEGY_DESIGNER preference key).

# ===== Chat Configuration =====
quorumtrading.chat.session-ttl=P7D
quorumtrading.chat.max-tool-iterations=5
quorumtrading.chat.history-min-messages=3

# ===== LLM Router Configuration =====
# Provider preference order (comma-separated)
quorumtrading.llm.router.provider-order=local-llm,openrouter

# Metrics logging interval (seconds)
quorumtrading.llm.router.metrics.log-interval-seconds=300

# ===== Runtime LLM Provider Selection (self-host edition) =====
# llm.local.enabled    — makes the local CLI adapter (claude/codex/gemini/qwen) a selectable
#                        provider. Off in the hosted SaaS (OpenRouter is the platform engine).
# llm.selection.enabled — turns on the explicit user choice: /api/v1/llm/setup page, JSON select
#                        endpoints, get_llm_status/choose_llm_provider MCP tools, and STRICT
#                        routing (no provider chosen → actionable error; chosen → that provider
#                        only, never a silent paid fallback). The endpoints are anonymous by
#                        design — NEVER enable this on a multi-user deployment.
# Both default OFF everywhere and ON in the %local profile (the self-host edition).
quorumtrading.llm.local.enabled=${QT_LLM_LOCAL_ENABLED:false}
# llm.localhttp.enabled — makes a local OpenAI-compatible HTTP server (Ollama, LM Studio, …) a
#                        selectable provider. Reachable from the container via host.docker.internal,
#                        so it works OOTB in Docker where the CLI local provider cannot. Same on/off
#                        policy as the CLI local provider: off by default, on in %local.
quorumtrading.llm.localhttp.enabled=${QT_LLM_LOCALHTTP_ENABLED:false}
quorumtrading.llm.selection.enabled=${QT_LLM_SELECTION_ENABLED:false}
# llm.auto-select.enabled — at boot, when nothing is chosen, pick the first available engine
#                        (free CLI → free local server → OpenRouter). Zero-click for self-hosters.
quorumtrading.llm.auto-select.enabled=${QT_LLM_AUTO_SELECT_ENABLED:false}
quorumtrading.llm.setup-url=${QT_LLM_SETUP_URL:http://localhost:8085/api/v1/llm/setup}
%local.quorumtrading.llm.local.enabled=${QT_LLM_LOCAL_ENABLED:true}
%local.quorumtrading.llm.localhttp.enabled=${QT_LLM_LOCALHTTP_ENABLED:true}
%local.quorumtrading.llm.selection.enabled=${QT_LLM_SELECTION_ENABLED:true}
%local.quorumtrading.llm.auto-select.enabled=${QT_LLM_AUTO_SELECT_ENABLED:true}

# ===== Consensus round timeouts =====
# agent-timeout-seconds    — cap on the parallel specialist-agent fan-out within one round.
# pipeline-timeout-seconds — cap on a full per-ticker pipeline (agents + orchestrator).
# llm.call-timeout-seconds — the LLM router's hard cap on ONE call (the whole provider chain,
#                            LLMRouterAdapter). Every agent/orchestrator call passes through it,
#                            so it must sit ABOVE the per-provider HTTP/CLI timeout (the provider's
#                            own timeout is the informative one) — and no consensus timeout,
#                            however generous, can save a call this cap already killed.
# Hosted APIs answer in seconds, so the defaults are tight; LOCAL engines (Ollama, LM Studio,
# CLI shims) can need minutes per call — with too small a timeout every backtest round times
# out and is recorded as SKIPPED. The %local profile therefore gets generous defaults across
# the whole ladder: provider HTTP/CLI 300s < router call 330s; agent fan-out 300s, pipeline 360s.
quorumtrading.consensus.agent-timeout-seconds=${QT_CONSENSUS_AGENT_TIMEOUT_SECONDS:30}
quorumtrading.consensus.pipeline-timeout-seconds=${QT_CONSENSUS_PIPELINE_TIMEOUT_SECONDS:45}
quorumtrading.llm.call-timeout-seconds=${QT_LLM_CALL_TIMEOUT_SECONDS:90}
%local.quorumtrading.consensus.agent-timeout-seconds=${QT_CONSENSUS_AGENT_TIMEOUT_SECONDS:300}
%local.quorumtrading.consensus.pipeline-timeout-seconds=${QT_CONSENSUS_PIPELINE_TIMEOUT_SECONDS:360}
%local.quorumtrading.llm.call-timeout-seconds=${QT_LLM_CALL_TIMEOUT_SECONDS:330}

# ===== Market Research LLM Configuration =====
# The research MODEL is not configured here. Research resolves it through the same chain as
# consensus, whose system default is quorumtrading.llm.defaults.research above.
#
# There used to be a second key, quorumtrading.llm.research.model, holding the same value. Two names
# for one concept is exactly how they drift apart: research read the duplicate and the tier-6 key was
# bypassed entirely, which went unnoticed only because both happened to hold the same string. It was
# removed rather than aliased — an alias keeps both names alive.
#
# research.model-online went with it. ':online' is a capability decoration applied at call time when
# web search is wanted, orthogonal to which model was chosen; baking it into a config key made it
# look like a different model.
quorumtrading.llm.research.temperature=0.7
quorumtrading.llm.research.max-tokens=8000

# ===== Technical Indicators Configuration =====
# Enable template-based strategy generation using technical indicators
quorumtrading.indicators.enabled=true
# Number of historical data days to fetch for indicator calculation
quorumtrading.indicators.historical-data-days=200
# Minimum confidence score (0-100) required to use template-based generation
quorumtrading.indicators.template-confidence-threshold=60

# ===== Circuit Breaker Configuration =====
# Global circuit breaker settings (applies to all LLM adapters)
quarkus.fault-tolerance.global.circuit-breaker.request-volume-threshold=20
quarkus.fault-tolerance.global.circuit-breaker.failure-ratio=0.5
quarkus.fault-tolerance.global.circuit-breaker.delay=60000
quarkus.fault-tolerance.global.circuit-breaker.success-threshold=2

# OpenRouter Configuration
openrouter.api.key=${OPENROUTER_API_KEY:not-configured}
openrouter.base.url=https://openrouter.ai/api/v1
openrouter.timeout=60s

# OpenRouter Model Fallback Configuration
# OpenRouter Model Fallback Configuration (based on 7 rounds of A/B testing)
# Primary: mistral-small-24b - Best value ($0.000099/call), respects position limits
# Fallback 1: llama-4-scout - Fast, reliable JSON ($0.000210/call), replaces deprecated gemini-2.0-flash
# Fallback 2: cohere/command-r7b - Budget option ($0.000101/call), +8.30% returns
# Fallback 3: deepseek-v3.2 - GPT-5 class reasoning ($0.000489/call), replaces overpriced gpt-oss-120b
# AVOID: FREE tier models (100% parse failures), llama-3.3-70b (ignores limits), mistral-nemo (reckless)
quorumtrading.llm.openrouter.model.fallback=mistralai/mistral-small-3.2-24b-instruct,meta-llama/llama-4-scout,cohere/command-r7b-12-2024,deepseek/deepseek-v3.2

# Exponential backoff cache configuration for rate-limited models
quorumtrading.llm.openrouter.cache.initial-backoff-minutes=30
quorumtrading.llm.openrouter.cache.max-backoff-minutes=720

# Local LLM Provider Configuration
quorumtrading.llm.local.default-tool=claude
quorumtrading.llm.local.timeout-seconds=120
%local.quorumtrading.llm.local.timeout-seconds=300
# Fallback chain: Prioritize fast, reliable tools (claude, qwen). Skip slow tools (codex, gemini)
#
# This is a cross-TOOL chain — "this tool is not installed / just failed, try the next one". It is a
# different axis from claude's own --fallback-model, which is a cross-MODEL chain. We deliberately
# run only this one: enabling both would stack two independent layers of silent substitution, which
# is precisely the class of defect the model-resolution work removes.
#
# 'opencode' is a supported entry (it is the one CLI that speaks provider/model natively, so it can
# serve an OpenRouter-style id unchanged) but is not in the default chain — adding it would change
# which tool runs on existing installs.
quorumtrading.llm.local.tool.fallback=claude,qwen

# --- opencode engine -----------------------------------------------------------------------------
# Opt in by naming 'opencode' as the default-tool or adding it to the fallback chain above. Shipped
# defaults are unchanged: claude still runs unless someone deliberately selects this.
#
# working-dir: the directory opencode runs in. Blank → a scratch dir under the system temp dir.
#   It must NOT inherit the JVM's working directory: opencode auto-discovers project context from
#   wherever it starts, and measured on 1.18.10 that cost 13,800 input tokens per call from a repo
#   checkout against 6,230 from an empty directory — 7,570 tokens of unrelated repository context on
#   every agent of every trading day. Running inside a git repo also made it snapshot the worktree.
quorumtrading.llm.local.opencode.working-dir=${QT_LLM_OPENCODE_DIR:}
#
# agent: the opencode agent persona (--agent). Blank → flag omitted, and opencode uses its own
#   default agent 'build', which is a CODING ASSISTANT and the wrong persona for a trading decision.
#   Set this to an agent you have created at ~/.config/opencode/agent/<name>.md — this platform will
#   not write into your home directory, and naming an agent that does not exist fails every call.
#   See docs/configuration/LLM_CONFIGURATION.md for the file to create.
quorumtrading.llm.local.opencode.agent=${QT_LLM_OPENCODE_AGENT:}
#
# auto-approve: pass --auto, which auto-approves any permission not explicitly denied.
#   OFF by default. Verified on 1.18.10 that unattended one-shot calls complete WITHOUT it once the
#   child's stdin is closed — the hangs it was assumed to prevent were the stdin bug, not permission
#   prompts. Turning it on lets the model run tools unattended, and opencode loads MCP servers from
#   the user's global config, so that can include this platform's own MCP tools.
quorumtrading.llm.local.opencode.auto-approve=${QT_LLM_OPENCODE_AUTO_APPROVE:false}

# Local HTTP LLM Provider (OpenAI-compatible server: Ollama, LM Studio, llama.cpp, vLLM, LocalAI)
# base-url: where the server listens. Default targets the HOST from inside the Docker container
#   (host.docker.internal — see extra_hosts in docker-compose.local.yml). For a NATIVE backend run,
#   set QT_LLM_LOCALHTTP_URL=http://localhost:11434/v1.
# model:   pin a local model name (e.g. llama3.2). Blank → auto-use the server's first advertised model.
quorumtrading.llm.localhttp.base-url=${QT_LLM_LOCALHTTP_URL:http://host.docker.internal:11434/v1}
quorumtrading.llm.localhttp.api-key=${QT_LLM_LOCALHTTP_API_KEY:not-configured}
quorumtrading.llm.localhttp.model=${QT_LLM_LOCALHTTP_MODEL:}
quorumtrading.llm.localhttp.timeout=${QT_LLM_LOCALHTTP_TIMEOUT:120s}
%local.quorumtrading.llm.localhttp.timeout=${QT_LLM_LOCALHTTP_TIMEOUT:300s}

# Exponential backoff cache configuration (faster blacklisting for unreliable tools)
quorumtrading.llm.local.cache.initial-backoff-minutes=30
quorumtrading.llm.local.cache.max-backoff-minutes=720

# ============================================
# MONITORED TICKERS SUMMARY
# ============================================
# This section documents all tickers currently used in strategies and available through price adapters.
# Last updated: 2026-01-27
#
# CRYPTO TICKERS (Alpaca):
#   Currently Monitored: BTC, ETH, SOL, DOGE, LTC, ADA, XRP
#   Coverage Status: 100% ✅
#
# STOCK TICKERS (Finnhub + Alpaca):
#   Currently Monitored: AAPL, MSFT, GOOGL, AMZN, TSLA, NVDA, AMD, META, PLTR, COIN, SPY, QQQ, GME, AMC, BBIG, DIA, GLD, IWM, TLT
#   Coverage Status: 100% ✅
# ============================================

# Market Data Collection Scheduler
# Auto-collect market data every 5 minutes (can be disabled for testing)
quorumtrading.marketdata.scheduled-collection.enabled=true

# Periodic Portfolio Snapshot Updates
# Update portfolio valuations every 5 minutes with fresh market prices (independent of consensus)
# Provides real-time portfolio tracking for LIVE simulations
quorumtrading.portfolio.periodic-snapshots.enabled=true

# Consensus Scheduler
# Automatically trigger consensus decisions for running, non-paused simulations
quorumtrading.scheduler.consensus.enabled=true
quorumtrading.scheduler.consensus.interval=1m

# Portfolio Evaluation Scheduler
# Automatically evaluate portfolio values with current market prices for running, non-paused simulations
quorumtrading.scheduler.portfolio-evaluation.enabled=true
quorumtrading.scheduler.portfolio-evaluation.interval=1m

# DCA Execution Scheduler (recurring investment plans)
# DISABLED BY DEFAULT — this scheduler moves real money on Alpaca live/paper accounts.
# Enable per environment only after smoke-testing the end-to-end flow.
# Cadence: daily probe (cron); fires plans whose next_execution_at <= now and status=ACTIVE.
# Idempotency for retries is enforced at the contribution layer via (planId, contributionDate) UNIQUE.
quorumtrading.scheduler.investments.enabled=false
quorumtrading.scheduler.investments.cron=0 0 6 * * ?
quorumtrading.scheduler.investments.batch-size=100
%test.quorumtrading.scheduler.investments.enabled=false

# =============================================================================
# Feature flags (Unleash SDK, definitions stored in the feature_flags table)
# =============================================================================
# These properties are SEEDS, not switches. On first boot a flag with no row is created with the
# value below; from then on the database is the source of truth and the admin UI (or psql) is how
# you change it. Editing a default here does NOT flip an already-seeded flag — that is deliberate,
# so a redeploy cannot silently undo an administrator's decision.
#
# They are also the fallback answer when a flag cannot be evaluated (flag store unreachable), so a
# production feature degrades to "as the profile intended" rather than to "off".
#
# Challenges: off in production and on a standalone self-hosted install (the leaderboard needs
# other participants to mean anything), on in dev and test so the feature stays exercised.
quorumtrading.features.challenges.default=false
%dev.quorumtrading.features.challenges.default=true
%test.quorumtrading.features.challenges.default=true
%e2e.quorumtrading.features.challenges.default=true

# Market research: on for the hosted product, off on a standalone install, which additionally has
# the older edition gate in front of it (HostedOnlyFeatureFilter).
quorumtrading.features.market-research.default=true
%local.quorumtrading.features.market-research.default=false

# How long an evaluated flag definition may be served before a background refresh is triggered.
# This is the delay between an admin flipping a flag and every node honouring it. Refreshes never
# happen on the calling thread, so this trades staleness for never blocking a request.
quorumtrading.features.cache-ttl-seconds=5
# Zero means read-through rather than "refresh constantly": a test that flips a flag and calls the
# API on the next line has to see the new value, which a background refresh cannot guarantee.
%test.quorumtrading.features.cache-ttl-seconds=0

# Strategy Picker for investment plans.
# mode=heuristic (default): deterministic pick of the most-recently-updated active strategy, no LLM.
# mode=llm: LLM-backed picker reads each candidate's content excerpt + plan preferences and selects one.
#          Falls back to the heuristic on LLM/parse failure so plans never break.
quorumtrading.picker.mode=heuristic
quorumtrading.picker.llm.model=openai/gpt-4o-mini
quorumtrading.picker.llm.temperature=0.2
quorumtrading.picker.llm.max-tokens=500
%test.quorumtrading.picker.mode=heuristic

# Email notifications (Phase 4)
# DISABLED BY DEFAULT — flip on per environment once SMTP is wired and the sender domain is verified.
# Quarkus mailer config (host/port/user/pass/tls) lives under quarkus.mailer.* (separate from this flag).
# unsubscribe-secret must be set in prod (env var); rotating it invalidates outstanding unsubscribe links.
quorumtrading.notifications.email.enabled=false
# Unsubscribe links must hit the API host (the endpoint lives under /api/v1), while CTA links in
# the same email point at the web app (quorumtrading.frontend.base-url / FRONTEND_URL). One shared
# base URL cannot serve both under host-based routing — prod sets EMAIL_API_BASE_URL to
# https://api.quorumtrading.com (see docs/operations/EMAIL_READINESS.md).
quorumtrading.notifications.email.api-base-url=${EMAIL_API_BASE_URL:http://localhost:8085}
quorumtrading.notifications.email.unsubscribe-secret=${UNSUBSCRIBE_SECRET:dev-only-unsubscribe-secret-rotate-in-prod}
# Prod has NO fallback default: startup fails fast if UNSUBSCRIBE_SECRET is unset.
