# Example Configurations
# ====================================

# Example 1: All trades through mock broker with current price sources
# quorumtrading.broker.crypto.type=mock
# quorumtrading.broker.stock.type=mock
# (Use existing Coinbase + Finnhub price data)

# Example 2: All trades through Alpaca with Alpaca price data (full consistency)
# quorumtrading.broker.crypto.type=alpaca
