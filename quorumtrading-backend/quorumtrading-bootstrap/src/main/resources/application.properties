quorumtrading.broker.alpaca.api-secret=${ALPACA_API_SECRET:not-configured}
quorumtrading.broker.alpaca.base-url=https://paper-api.alpaca.markets

# ------------------------------------------------------------------------------------
# Live-account creation guard (decision D8) — server-side, no global config key.
# ------------------------------------------------------------------------------------
# Creating ANY live (real-money) broker account — ALPACA_LIVE or SAXO_LIVE — is gated in
# CreateBrokerAccountService.requireLiveConfirmation(): the command's confirmLive flag MUST be
# true (keyed off BrokerType.isLive()). This is enforced in the application layer, NOT here, so
# it holds for every environment including %prod regardless of any properties below. There is no
# "allow live without confirmation" switch by design — the guard is fail-closed.
#
# Saxo accounts are per-account OAuth (no global key/secret) and are created exclusively through
# the OAuth consent flow (CreateBrokerAccountService.createFromOAuth), which skips the paste-key
# validation path. Saxo broker/market-data connection keys (default OFF, non-empty placeholders)
# are owned by the Saxo config WP (CFG1) and land in a later wave — do not add live Saxo secrets
# with empty defaults (empty ${ENV:} defaults break Quarkus string config validation).

# ====================================
# Saxo Bank (EU) Configuration  (CFG1 — authoritative owner)
# ====================================
# Saxo is a per-account OAuth broker (SAXO_SIM / SAXO_LIVE), reached only via a linked
# BrokerAccount through BrokerRouter — never via the global broker.stock/crypto.type keys.
# ALL Saxo features ship DEFAULT-OFF and stay off until the Go-Live promotion sequence is
# walked. The two Saxo adapter modules (adapter-broker-saxo, adapter-marketdata-saxo) also
# ship self-contained application.properties for isolated module tests; these bootstrap keys
# are the single authoritative source at runtime (CFG1) and reconcile the per-module defaults.
#
# Empty ${ENV:} defaults break Quarkus string-config validation — every value below uses a
# non-empty placeholder.

# Feature flags — DEFAULT OFF in EVERY profile, including %local (standalone). The two Saxo adapters
# toggle together off the same env switch. Saxo is experimental and untested against a live account
# (see docs/adr/0002 context + CAPABILITIES.md), so even the standalone edition ships it OFF; a
# self-hoster who wants to try the EU broker opts in explicitly with SAXO_ENABLED=true. The %local
# lines are kept explicit to document that this default is deliberate, not an oversight.
quorumtrading.broker.saxo.enabled=${SAXO_ENABLED:false}
quorumtrading.marketdata.saxo.enabled=${SAXO_ENABLED:false}
%local.quorumtrading.broker.saxo.enabled=${SAXO_ENABLED:false}
%local.quorumtrading.marketdata.saxo.enabled=${SAXO_ENABLED:false}
# Certificate-based (CBA) auth — PERMANENTLY DISABLED for retail. Saxo offers Certificate-Based
# Authentication to INSTITUTIONAL PARTNERS ONLY; retail/direct clients cannot use it (MiFID
# disclaimers must be shown at login and cannot be automated) — docs/operations/SAXO_ANSWERS.md §1.2.
# The retail path relies solely on the rotating single-use refresh-token OAuth model. This gate stays
# OFF; flip it only if Saxo ever grants this app institutional CBA eligibility (not expected for retail).
quorumtrading.broker.saxo.cert.enabled=${SAXO_CERT_ENABLED:false}

# Saxo OpenApi gateway base URLs. SIM by default; LIVE selected per account environment.
# Shared by both the broker (trade + reference-data) and the market-data adapters.
# TODO: confirm the exact SIM/LIVE gateway hosts + base paths before any live promotion.
quorumtrading.broker.saxo.base-url-sim=${SAXO_BASE_URL_SIM:https://gateway.saxobank.com/sim/openapi}
quorumtrading.broker.saxo.base-url-live=${SAXO_BASE_URL_LIVE:https://gateway.saxobank.com/openapi}
# Market-data adapter reads its own keys; point them at the shared broker base URLs.
quorumtrading.marketdata.saxo.base-url-sim=${quorumtrading.broker.saxo.base-url-sim}
quorumtrading.marketdata.saxo.base-url-live=${quorumtrading.broker.saxo.base-url-live}

# Saxo OAuth application credentials (app-key / app-secret) — per-environment OAuth app
# registration, supplied via env. NOT per-account (that is the rotating refresh/access token,
# stored encrypted per BrokerAccount). Non-empty placeholders so config validation passes when
# Saxo is off; replace with real ECS secrets before enabling.
quorumtrading.broker.saxo.app-key=${SAXO_APP_KEY:not-configured}
quorumtrading.broker.saxo.app-secret=${SAXO_APP_SECRET:not-configured}

# Saxo OAuth hosts (logon validation) — separate host from the token/API gateway. Confidential
# Authorization-Code flow (SAXO_ANSWERS §1.5): the onboarding service builds the authorize URL
# (client_id + redirect_uri + response_type=code + state; NO PKCE) and the token client posts to
# the token URL with HTTP Basic (client_id:client_secret). Per-environment SIM vs LIVE:
#   SIM : https://sim.logonvalidation.net/{authorize,token}
#   LIVE: https://live.logonvalidation.net/{authorize,token}   (⚠️ confirm exact LIVE strings)
# SIM defaults below; the authorize-url / token-url the adapter binds default to SIM. The LIVE
# host strings are documented best-effort (SAXO_ANSWERS §1.5 ⚠️ — reconfirm against the LIVE
# credentials packet) and supplied here so a per-environment split can bind them without new keys.
quorumtrading.broker.saxo.authorize-url=${SAXO_AUTHORIZE_URL:https://sim.logonvalidation.net/authorize}
quorumtrading.broker.saxo.authorize-url-sim=${SAXO_AUTHORIZE_URL_SIM:https://sim.logonvalidation.net/authorize}
quorumtrading.broker.saxo.authorize-url-live=${SAXO_AUTHORIZE_URL_LIVE:https://live.logonvalidation.net/authorize}
quorumtrading.broker.saxo.token-url=${SAXO_TOKEN_URL:https://sim.logonvalidation.net/token}
quorumtrading.broker.saxo.token-url-sim=${SAXO_TOKEN_URL_SIM:https://sim.logonvalidation.net/token}
quorumtrading.broker.saxo.token-url-live=${SAXO_TOKEN_URL_LIVE:https://live.logonvalidation.net/token}
# The token rest-client binds the SIM token URL by default; a per-environment (SIM vs LIVE) token
# host split is TODO (SAXO_ANSWERS §1.5 ⚠️) — the single rest-client points at one endpoint.
quarkus.rest-client.saxo-oauth.url=${quorumtrading.broker.saxo.token-url}
quarkus.rest-client.saxo-oauth.scope=jakarta.inject.Singleton
# How long a single-use onboarding state stays valid between begin and callback.
quorumtrading.broker.saxo.onboarding.state-ttl-seconds=${SAXO_ONBOARDING_STATE_TTL_SECONDS:600}
# Redirect URI Saxo calls back after consent. MUST exactly match the redirect URI registered on the
# Saxo OAuth app, and is replayed verbatim on the token exchange. Defaults to the local-edition
# callback on the dev port (8085); override for other hosts/ports.
quorumtrading.broker.saxo.redirect-uri=${SAXO_REDIRECT_URI:http://localhost:8085/api/v1/broker-accounts/saxo/onboard/callback}

# REST clients — declared by SB1 (saxo-trading, saxo-ref) and MD1 (saxo-openapi).
# Default to the SIM gateway; the per-account environment selects SIM vs LIVE at runtime.
quarkus.rest-client.saxo-trading.url=${quorumtrading.broker.saxo.base-url-sim}
quarkus.rest-client.saxo-trading.scope=jakarta.inject.Singleton
quarkus.rest-client.saxo-ref.url=${quorumtrading.broker.saxo.base-url-sim}
quarkus.rest-client.saxo-ref.scope=jakarta.inject.Singleton
quarkus.rest-client.saxo-openapi.url=${quorumtrading.marketdata.saxo.base-url-sim}
quarkus.rest-client.saxo-openapi.scope=jakarta.inject.Singleton

# Test profile: keep Saxo OFF, but supply valid non-empty stub values so the app BOOTS in
# tests (no live calls are made; WireMock/test resources override the URLs where exercised).
%test.quorumtrading.broker.saxo.enabled=false
%test.quorumtrading.marketdata.saxo.enabled=false
%test.quorumtrading.broker.saxo.cert.enabled=false
%test.quorumtrading.broker.saxo.app-key=test-saxo-app-key
%test.quorumtrading.broker.saxo.app-secret=test-saxo-app-secret
%test.quorumtrading.broker.saxo.authorize-url=https://sim.logonvalidation.net/authorize
%test.quorumtrading.broker.saxo.authorize-url-sim=https://sim.logonvalidation.net/authorize
%test.quorumtrading.broker.saxo.authorize-url-live=https://live.logonvalidation.net/authorize
%test.quorumtrading.broker.saxo.token-url=https://sim.logonvalidation.net/token
%test.quorumtrading.broker.saxo.token-url-sim=https://sim.logonvalidation.net/token
%test.quorumtrading.broker.saxo.token-url-live=https://live.logonvalidation.net/token
%test.quorumtrading.broker.saxo.onboarding.state-ttl-seconds=600
%test.quorumtrading.broker.saxo.redirect-uri=http://localhost:8085/api/v1/broker-accounts/saxo/onboard/callback
%test.quarkus.rest-client.saxo-trading.url=http://localhost:1
%test.quarkus.rest-client.saxo-ref.url=http://localhost:1
%test.quarkus.rest-client.saxo-oauth.url=http://localhost:1
%test.quarkus.rest-client.saxo-openapi.url=http://localhost:1

# ====================================
# Market Data Source Configuration
# ====================================
# Configure which price sources to use for portfolio valuation.
# When using Alpaca broker, enable Alpaca market data for consistency.

# Alpaca Market Data Adapter - Primary source for BOTH live pricing AND historical backfill
# Supports: LIVE_TRADING, BACKFILL, CRYPTO, STOCK, CANDLES, INTRADAY, DAILY
# Used for all stock and crypto price data fetching in simulations
quorumtrading.marketdata.alpaca.enabled=true
quorumtrading.marketdata.alpaca.api-key=${ALPACA_API_KEY:not-configured}
quorumtrading.marketdata.alpaca.api-secret=${ALPACA_API_SECRET:not-configured}
quorumtrading.marketdata.alpaca.base-url=${ALPACA_MARKETDATA_BASE_URL:https://data.alpaca.markets}
# Stock data feed: 'iex' (free, IEX Exchange only) or 'sip' (paid, all US exchanges consolidated)
# IMPORTANT: Free Alpaca accounts MUST use 'iex'. SIP requires Algo Trader Plus or market data subscription.
quorumtrading.marketdata.alpaca.stock-feed=${ALPACA_STOCK_FEED:iex}
# Crypto symbols monitored by Alpaca (comma-separated, e.g., BTC,ETH,SOL)
quorumtrading.marketdata.alpaca.crypto-symbols=BTC,ETH,SOL,DOGE,LTC,ADA,XRP
# Stock symbols monitored by Alpaca (comma-separated, e.g., AAPL,TSLA,NVDA)
# Includes: Tech, Defense (LMT,NOC,RTX,GD,BA), Energy (XLE,XOM,CVX), Sector ETFs (XAR)
quorumtrading.marketdata.alpaca.stock-symbols=AAPL,MSFT,TSLA,NVDA,AMD,PLTR,COIN,SPY,QQQ,GME,AMC,XLE,LMT,NOC,XAR,RTX,GD,BA,XOM,CVX

# Tiingo Market Data Adapter - Fallback for historical daily stock data (30+ years)
# Supports: STOCK, BACKFILL, CANDLES, DAILY (NO crypto, NO intraday)
# Used when Alpaca has no data (e.g., pre-2020 backtests)
# Free tier: 50 req/hr, 1000/day, 500 unique symbols/month
quorumtrading.marketdata.tiingo.enabled=${TIINGO_ENABLED:true}
# Tiingo license prohibits production use — force disabled in prod profile
%prod.quorumtrading.marketdata.tiingo.enabled=false
quorumtrading.marketdata.tiingo.api-token=${TIINGO_API_TOKEN:not-configured}

# Keyless crypto market-data adapters — Kraken + Coinbase, each a plain MarketDataPort. No API key:
# public exchange market data queried directly by this install (no redistribution). Together they
# are what makes crypto backfill/backtest work out of the box in the standalone edition; the
# application layer's provider selection composes them (widest-result-wins / fallback chain), so
# there is no orchestrator — "standalone-only" is expressed purely by these flags. Kraken serves
# ~2yr of daily bars in one call; Coinbase paginates deeper daily history (back to ~2016).
# See docs/adr/0002-standalone-hosted-price-source.md. Supports: CRYPTO, BACKFILL, CANDLES, INTRADAY, DAILY.
quorumtrading.marketdata.kraken.enabled=${KRAKEN_MARKETDATA_ENABLED:true}
quorumtrading.marketdata.coinbase.enabled=${COINBASE_MARKETDATA_ENABLED:true}
# In prod, Alpaca is the primary crypto source; keep the keyless feeds off to avoid duplicate calls.
%prod.quorumtrading.marketdata.kraken.enabled=false
%prod.quorumtrading.marketdata.coinbase.enabled=false
# Never hit live exchanges from tests / e2e (CI must not make external network calls).
%test.quorumtrading.marketdata.kraken.enabled=false
%test.quorumtrading.marketdata.coinbase.enabled=false
%e2e.quorumtrading.marketdata.kraken.enabled=false
%e2e.quorumtrading.marketdata.coinbase.enabled=false

