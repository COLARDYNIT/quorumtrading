# =============================================================================
# E2E PROFILE (for end-to-end testing with Playwright)
# =============================================================================

# Port + database: without these, %e2e would inherit the PROD defaults (8080, quorumtrading) —
# the Playwright fixtures expect the backend on 8085 and a disposable test database.
%e2e.quarkus.http.port=8085
%e2e.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:55432/quorumtrading_test

# Use dummy LLM executor only. llm.local.enabled makes the LocalLLMAdapter bean visible to the
# router's CDI discovery (see @LookupIfProperty on LocalLLMAdapter) — without it the router finds
# no providers and every agent call fails. default-tool + fallback pin the chain to the dummy,
# so no real CLI tool is ever invoked.
%e2e.quorumtrading.llm.local.enabled=true
%e2e.quorumtrading.llm.local.default-tool=dummy
%e2e.quorumtrading.llm.local.tool.fallback=dummy
# Only one provider — OpenRouter is unavailable anyway (placeholder key); explicit beats implicit
%e2e.quorumtrading.llm.router.provider-order=local-llm

# Deterministic DB every backend boot + seeded BTC market data. The seed runs via
# E2eMarketDataSeeder at startup (quarkus.flyway.locations is build-time fixed, so the seed
# cannot be an extra %e2e-only Flyway location).
%e2e.quarkus.flyway.clean-at-start=true
%e2e.quorumtrading.e2e.seed-market-data.enabled=true

# Silence real-world background work (keeps logs clean and evaluations deterministic).
# NOTE: quorumtrading.scheduler.simulation-pickup.* stays ON — it is the 30s retry that rescues
# a simulation if the async data-ready handler loses a race.
%e2e.quorumtrading.marketdata.scheduled-collection.enabled=false
%e2e.quorumtrading.scheduler.consensus.enabled=false
%e2e.quorumtrading.scheduler.portfolio-evaluation.enabled=false

# A caught-up backtest transitions SIMULATING → LIVE; the end-simulation scheduler is what flips
# it LIVE → COMPLETED once past its end date. Tighten it from 5m so the e2e sees COMPLETED fast.
%e2e.quorumtrading.scheduler.end-simulation.interval=10s

# Enable dev-login endpoint
%e2e.quorumtrading.auth.dev-login-enabled=true

# Use mock broker
%e2e.quorumtrading.broker.default=mock

# Enable all OIDC tenants as disabled (dev-login bypasses)
%e2e.quarkus.oidc.tenant-enabled=false
%e2e.quarkus.oidc.google.tenant-enabled=false
%e2e.quarkus.oidc.apple.tenant-enabled=false
%e2e.quarkus.oidc.github.tenant-enabled=false
%e2e.quarkus.oidc.microsoft.tenant-enabled=false
%e2e.quarkus.oidc.gitlab.tenant-enabled=false
%e2e.quarkus.oidc.amazon.tenant-enabled=false

# =============================================================================
# MCP SERVER CONFIGURATION
# =============================================================================

# MCP auth: API token validated by McpUserContext (no OIDC needed)
# Permit unauthenticated HTTP access to /mcp paths; McpUserContext handles auth via API tokens
quarkus.http.auth.permission.mcp.paths=/mcp,/mcp/*
quarkus.http.auth.permission.mcp.policy=permit

# Deny-by-default for REST: an endpoint with no security annotation is rejected rather than
# served anonymously. Historically the absence of @Authenticated silently made a resource
# public, and the resource-level `.orElse(null)` then skipped the ownership check downstream --
# so a missing annotation meant unauthenticated read/write on other users' data. Every public
# endpoint now declares @PermitAll explicitly; new endpoints must state their posture or fail.
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# MCP server instructions (returned in the initialize response as guidance for LLM clients)
quarkus.mcp.server.server-info.instructions=QuorumTrading is a multi-LLM trading consensus platform that orchestrates AI agents (Technical, Fundamental, Sentiment) to make collaborative trading decisions with historical backtesting.\n\
\n\
**Recommended workflow:** Strategy → Simulation → Live\n\
1. Backfill price data for your target ticker\n\
2. Write a strategy, or run market research to discover one (research is behind the `market-research` feature flag; if its tools are absent an administrator can switch the flag on, or write the strategy directly)\n\
3. Create a backtest simulation to validate the strategy historically\n\
4. Review consensus decisions and portfolio performance\n\
5. When satisfied, set up live trading with a broker account\n\
\n\
**Guided prompts** — use these for step-by-step workflows:\n\
- `full_research_cycle` — end-to-end: backfill data, check indicators, create research, execute, review (needs the `market-research` feature flag)\n\
- `create_backtest` — configure and launch a backtest simulation\n\
- `analyze_simulation` — deep-dive into simulation performance and agent decisions\n\
- `compare_strategies` — rank strategies by return, win rate, and risk metrics\n\
- `analyze_market_research` — review research executions, agent decisions, and viability scores (needs the `market-research` feature flag)\n\
- `setup_live_trading` — verify broker, select strategy, and go live\n\
- `diagnose_simulation` — troubleshoot failing or underperforming simulations\n\
- `explain_indicators` — calculate and interpret technical indicators for any ticker\n\
\n\
**Trading modes** (controlled by `brokerAccountId` in `create_simulation`):\n\
- Default (no `brokerAccountId`) = mock broker backtest — replays historical data, no real money\n\
- Paper trading = pass `brokerAccountId` of an ALPACA_PAPER account — user must explicitly request this\n\
- Live trading = pass `brokerAccountId` of an ALPACA_LIVE account — ALWAYS confirm with user before proceeding (state broker, strategy, symbol, cash)\n\
- Broker accounts are created via the web UI — credentials cannot go through MCP\n\
\n\
**Cost awareness for backtests:**\n\
- Creating a simulation STARTS it: the run begins on its own once market data is ready, usually within seconds. There is no dormant state in which you can create one, read its cost, and then decide — creating a backtest commits to paying for it\n\
- Each trading day triggers 4+ AI agent consensus calls — longer backtests consume more AI budget\n\
- Backtests < 1 month: create freely\n\
- Backtests > 1 month: inform the user about cost implications BEFORE creating\n\
- Backtests > 3 months: warn about significant AI budget use and suggest starting shorter\n\
- Set userInformedOfCost=true on create_simulation / create_benchmark after informing the user\n\
- get_simulation_cost reports what a run HAS spent, not what a planned run would spend — do not create a simulation just to price it\n\
- estimate_backtest_cost prices a PLANNED backtest without creating it, and respects the strategy's backtest_schedule. Use it whenever cost matters. If it reports zero trading days, the run would decide nothing — do not create it\n\
- NEVER refuse to create a long backtest — just ensure the user knows the cost\n\
\n\
**Prerequisites a new user hits first:**\n\
- AI decisions need a selected LLM engine. get_llm_status says whether one can answer; choose_llm_provider selects one. Without it every evaluation is skipped and the run still reports COMPLETED at 0.00%\n\
- Crypto price data is keyless — no broker, no API key. US stocks need a market-data key configured on the instance. get_guide('market-data') covers both\n\
\n\
**Viewing things in the web app:** responses describing a simulation, strategy, investment plan, benchmark, challenge, or market research include a `uiUrl` — the entity's page in the web app. When the user wants to see something in a browser, give them that link; never construct one yourself. If `uiUrl` is absent, this instance runs headless and there is no page to open.\n\
\n\
**Tool categories:** strategies, simulations, consensus analysis, portfolio tracking, market data & indicators, market research, and broker accounts.

# MCP connection resiliency settings
# Auto-ping to detect dead connections faster (default: not set)
quarkus.mcp.server.auto-ping-interval=30s
# Auto-reinitialize sessions when requests arrive with invalid/stale session IDs (e.g., after hot-reload)
quarkus.mcp.server.http.streamable.dummy-init=true
# Connection idle timeout (default: 30m)
quarkus.mcp.server.connection-idle-timeout=60m
# tools/list / resources/list / prompts/list page-size defaults to 50. Once the
# catalog exceeded 50 tools, half the tools silently dropped off the response
# for clients that don't follow `nextCursor` (Claude Code's MCP SDK included).
# The "missing tool classes" reported as a Quarkus generics bug were actually
# this: registration order is non-deterministic, so which classes landed on
# page 1 vs page 2 rotated across restarts. Bump well past current counts so
# a single page returns everything. Revisit if catalog ever exceeds this.
quarkus.mcp.server.tools.page-size=500
quarkus.mcp.server.resources.page-size=500
quarkus.mcp.server.resource-templates.page-size=500
quarkus.mcp.server.prompts.page-size=500

# MCP server traffic logging
quarkus.log.category."io.quarkiverse.mcp".level=DEBUG
quarkus.log.category."com.quorumtrading.adapter.mcp".level=DEBUG
# Suppress noisy MCP ping warnings when no SSE streams are open
quarkus.log.category."io.quarkiverse.mcp.server.http.runtime.StreamableHttpMcpConnection".level=ERROR

# ===== Smoke profile (%smoke) — native integration smoke tests =====
# Used ONLY by the `*IT` classes under quorumtrading-bootstrap/src/test. Those are
# @QuarkusIntegrationTest, so they do not boot Quarkus in-JVM like every other test here: they
# launch the PACKAGED ARTIFACT as a separate process. Under -Pnative that artifact is the native
# binary this repo ships to production, which is the entire point — a chat 500 caused by a missing
# reflection registration only exists in the native image, so only the native image can be asked.
#
# The artifact is BUILT with the prod profile and merely LAUNCHED with this one
# (quarkus.test.integration-test-profile=smoke, set on maven-failsafe-plugin in the bootstrap pom,
# which the launcher turns into -Dquarkus.profile=smoke). Build-time config is therefore prod's;
# only the runtime knobs below move. The binary under test is the binary that gets pushed.
#
# Why not just launch it as prod? Because prod is deliberately un-bootable in CI and must stay so:
# %prod demands UNSUBSCRIBE_SECRET / BROKER_CREDENTIALS_ENCRYPTION_KEY /
# OIDC_SESSION_ENCRYPTION_SECRET with no fallback, and SecurityStartupValidator hard-fails when
# dev-login is on under the prod profile — while a smoke test needs dev-login to authenticate at
# all. The alternative was to soften one of those; a separate profile softens neither.
#
# Keep this block minimal. Every line here is a way the smoke run differs from production.

# CI (and a local run) has postgres on 55432 with the quorumtrading_test database, same service
# definition the app repo's ci.yml uses. Flyway migrates it at start, as in every other mode.
%smoke.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:55432/quorumtrading_test

# The smoke tests authenticate the way e2e does: GET /api/v1/auth/fut-login for a throwaway user,
# then the dev_session cookie it returns. Enabling this under any profile named "prod" is a boot
# failure, by design — see docs/RUN_MODES.md.
%smoke.quorumtrading.auth.dev-login-enabled=true

# Background work off. A smoke test asserts that the binary boots and answers HTTP; it must not
# start evaluating consensus, picking up simulations or collecting market data against a scratch
# database with no provider credentials. Quartz still runs its clustered JDBC store, so that path
# is still exercised at boot.
%smoke.quorumtrading.scheduler.consensus.enabled=false
%smoke.quorumtrading.scheduler.portfolio-evaluation.enabled=false
%smoke.quorumtrading.scheduler.simulation-pickup.enabled=false
%smoke.quorumtrading.marketdata.scheduled-collection.enabled=false

# OIDC off, like every profile other than prod. Not optional and not laziness: an OIDC tenant
# defaults to ENABLED, and an enabled tenant with no client-id aborts startup with
# "'quarkus.oidc.client-id' property must be configured". Prod supplies real client ids from the
# environment; CI has none and must not. Each tenant is listed by name because that is the only
# thing Quarkus reads — %dev, %test and %local all carry the same seven lines for the same reason.
# This is the one place where the smoke run is meaningfully unlike production: prod authenticates
# with OIDC, the smoke run with dev-login.
%smoke.quarkus.oidc.tenant-enabled=false
%smoke.quarkus.oidc.google.tenant-enabled=false
%smoke.quarkus.oidc.apple.tenant-enabled=false
%smoke.quarkus.oidc.github.tenant-enabled=false
%smoke.quarkus.oidc.microsoft.tenant-enabled=false
%smoke.quarkus.oidc.gitlab.tenant-enabled=false
%smoke.quarkus.oidc.amazon.tenant-enabled=false
