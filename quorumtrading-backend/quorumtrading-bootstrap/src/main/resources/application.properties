# Example 3: Mixed routing (crypto via mock, stocks via Alpaca)
# quorumtrading.broker.crypto.type=mock
# quorumtrading.broker.stock.type=alpaca
# quorumtrading.broker.alpaca.enabled=true
# quorumtrading.marketdata.alpaca.enabled=true  # Use Alpaca prices for consistency

# ===== Quartz Clustered Scheduler =====
# JDBC clustering ensures only one ECS task fires each scheduled job
quarkus.quartz.clustered=true
quarkus.quartz.store-type=jdbc-cmt
quarkus.quartz.misfire-policy.cron-trigger-type-override=ignore-misfire-policy
quarkus.quartz.misfire-policy.simple-trigger-type-override=ignore-misfire-policy

# Test profile: use in-memory store (no JDBC clustering)
%test.quarkus.quartz.store-type=ram
%test.quarkus.quartz.clustered=false

# ===== Redis Configuration =====
quarkus.redis.hosts=${QUARKUS_REDIS_HOSTS:redis://localhost:6379}
quarkus.redis.max-pool-size=12
quarkus.redis.max-pool-waiting=24
%test.quarkus.redis.hosts=redis://localhost:6379
%test.quarkus.redis.health.enabled=false

# Scheduler configuration
# Enable/disable scheduler (enabled by default in dev/prod, disabled in test)
%test.quarkus.scheduler.enabled=false

# ===== Micrometer Metrics Configuration =====
# Enable JVM and system metrics for ThreadPool visibility
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.export.prometheus.enabled=true

# ===== ThreadPool Health Check Thresholds =====
# Queue utilization percentage that triggers DOWN status (0-100)
quorumtrading.health.threadpool.queue-utilization-threshold=80
# Seconds of full saturation (activeThreads == maxPoolSize) before DOWN
quorumtrading.health.threadpool.saturation-duration-seconds=30

# ===== Simulation Executor Pool =====
# Dedicated thread pool for running backtesting simulations asynchronously.
# Prevents blocking CDI event threads during multi-hour backtest execution.
quorumtrading.simulation.executor.max-async=5
quorumtrading.simulation.executor.max-queued=50

# ===== Agent Orchestrator Pool =====
# Thread pool for parallel AI agent queries (Technical, Fundamental, Sentiment).
# With 5 concurrent sims × 3 agents × multi-ticker, 50 async slots avoids starvation.
quorumtrading.agent.executor.max-async=50
quorumtrading.agent.executor.max-queued=200

# ===== Simulation Pickup Scheduler =====
# Enables horizontal scaling: idle ECS instances pick up queued simulations.
quorumtrading.scheduler.simulation-pickup.enabled=true
quorumtrading.scheduler.simulation-pickup.interval=30s
%test.quorumtrading.scheduler.simulation-pickup.enabled=false

# ===== End-simulation scheduler =====
# Completing a LIVE simulation whose endDate has passed is this scheduler's real job and has no
# knobs. The keys below govern only the SIMULATING-backtest STALL DETECTOR, which never completes
# a run: it pauses it with EXECUTION_STALLED so it stays resumable and honestly reported.
# See docs/adr/0004-watchdogs-pause-on-evidence-never-fabricate-completion.md.
quorumtrading.scheduler.end-simulation.enabled=true
quorumtrading.scheduler.end-simulation.interval=5m

# Trip only when the execution lease has been dead this long. MUST exceed the executor's
# LOCK_TIMEOUT (15m) or a healthy long round looks abandoned; the service logs a warning if not.
quorumtrading.scheduler.end-simulation.lease-stale-after=20m
%local.quorumtrading.scheduler.end-simulation.lease-stale-after=45m
%e2e.quorumtrading.scheduler.end-simulation.lease-stale-after=1m

# ...and no consensus row has been written for this long (wall clock). %local runs the slow local
# engines — agent-timeout 300s / pipeline-timeout 360s means one round can legitimately take ~6
# minutes — so 2h is ~20 worst-case rounds. That number is set by engine speed, NOT by laptop
# suspend: suspend is handled exactly by observation-gap-reset below, which is what frees this
# threshold to be chosen for the thing it is actually about.
quorumtrading.scheduler.end-simulation.stall-grace=30m
%local.quorumtrading.scheduler.end-simulation.stall-grace=2h
%e2e.quorumtrading.scheduler.end-simulation.stall-grace=1m

# A gap larger than this between two of OUR ticks means the process was not observing (laptop
# suspend, a Quartz catch-up burst, or clustered ticks served by another instance) — re-arm the
# observation window instead of acting on signals that aged while we were asleep. Keep it at or
# above 4 x interval: with quarkus.quartz.clustered=true an instance sees its own ticks every
# interval x instanceCount, and a threshold that is too tight makes a multi-task fleet re-arm
# forever, i.e. never detect anything.
quorumtrading.scheduler.end-simulation.observation-gap-reset=20m
%e2e.quorumtrading.scheduler.end-simulation.observation-gap-reset=40s

# pause (default) | off. There is deliberately no "complete" — a watchdog that fabricates a
# terminal state turns an operational hiccup into a wrong number that leaderboards, benchmarks and
# strategy statistics then read as an authoritative result.
quorumtrading.scheduler.end-simulation.stall-action=pause
# Schedulers are off under %test anyway (quarkus.scheduler.enabled=false); set explicitly so a
# future test that enables them does not get a surprise watchdog.
%test.quorumtrading.scheduler.end-simulation.enabled=false
%test.quorumtrading.scheduler.end-simulation.stall-action=off

# ===== Phase 4: Strategy Health Checker Configuration =====
# Auto-disable underperforming strategies based on simulation results
# Min return percentage: strategies with returns below this are considered failing
quorumtrading.strategy-health.min-return-percent=-10
# Number of consecutive failures before auto-disabling (future feature)
quorumtrading.strategy-health.consecutive-failures-to-disable=3

