# Test profile configuration
# NOTE: Core test configuration (datasource, Hibernate, Flyway) is defined
# in src/main/resources/application.properties with %test. prefix
# Migrations are owned by the persistence adapter module and auto-discovered on classpath

# Index beans to enable CDI discovery
quarkus.index-dependency.persistence.group-id=ai.quorumtrading
quarkus.index-dependency.persistence.artifact-id=quorumtrading-adapter-persistence
quarkus.index-dependency.finnhub.group-id=ai.quorumtrading
quarkus.index-dependency.finnhub.artifact-id=quorumtrading-adapter-marketdata-finnhub
quarkus.index-dependency.rss.group-id=ai.quorumtrading
quarkus.index-dependency.rss.artifact-id=quorumtrading-adapter-marketdata-rss

# LLM Provider - LocalLLM (only adapter included in Phase 1)
quorumtrading.llm.local.default-tool=qwen
quorumtrading.llm.local.timeout-seconds=30

# Finnhub Provider (for HybridNewsSourcesIntegrationTest)
quorumtrading.providers.finnhub.api-key=${FINNHUB_API_KEY:dummy-test-key}
quorumtrading.providers.finnhub.news.enabled=true
quarkus.rest-client.finnhub-api.url=https://finnhub.io

# RSS Provider (for HybridNewsSourcesIntegrationTest)
quorumtrading.providers.rss.enabled=true
quorumtrading.providers.rss.feed-urls=https://www.cnbc.com/id/100003114/device/rss/rss.html

# Logging
quarkus.log.level=INFO
quarkus.log.category."ai.quorumtrading".level=INFO
