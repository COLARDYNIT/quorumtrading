# Saxo Bank (EU) Market-Data Adapter — REST client configuration (MD1 scaffold)
#
# Default OFF. These declare the config keys the Saxo OpenApi market-data REST client
# (InfoPrices live + Charts historical) needs; CFG1-config-keys (later wave,
# bootstrap/application.properties) is the authoritative owner of the real per-environment
# values, flags, and %test overrides. Non-empty placeholders are used so Quarkus
# string-config validation does not fail when nothing is set (per project rule).
#
# Saxo market-data is reached only per linked BrokerAccount (SAXO_SIM / SAXO_LIVE) using
# the same per-account OAuth bearer as the trade surface — never via a global broker-type
# config string.

# Feature flag (default OFF until the Go-Live promotion sequence is walked).
# Shares the broker-saxo flag key so the two Saxo adapters toggle together.
quorumtrading.marketdata.saxo.enabled=${SAXO_ENABLED:false}

# Saxo OpenApi base URL. Defaults to the SIM gateway; LIVE is selected per account env.
# Self-contained fallback so this module boots/tests even without the broker-saxo module on
# the classpath; CFG1 reconciles to the shared quorumtrading.broker.saxo.base-url-sim key.
# TODO(CFG1): confirm the exact SIM/LIVE gateway hosts and base paths.
quorumtrading.marketdata.saxo.base-url-sim=${SAXO_BASE_URL_SIM:https://gateway.saxobank.com/sim/openapi}
quorumtrading.marketdata.saxo.base-url-live=${SAXO_BASE_URL_LIVE:https://gateway.saxobank.com/openapi}

# REST client: market-data surface (/trade/v1/infoprices + /chart/v1/charts).
# Bearer added via @RegisterClientHeaders(SaxoAuthHeadersFactory).
quarkus.rest-client.saxo-openapi.url=${quorumtrading.marketdata.saxo.base-url-sim}
quarkus.rest-client.saxo-openapi.scope=jakarta.inject.Singleton

# REST client: this module's OWN reference-data surface (/ref/v1/instruments) used by the
# SaxoQuoteUicResolver to turn a Symbol into (Uic, AssetType) for the live-quote path (MD2).
# A distinct config key from the broker module's saxo-ref so the two Saxo adapters stay
# independent (adapters must not depend on each other). Defaults to the same base URL.
# Equity market data is LIVE-only (SIM has no equity data); CFG selects LIVE per account env.
quarkus.rest-client.saxo-md-ref.url=${quorumtrading.marketdata.saxo.base-url-sim}
quarkus.rest-client.saxo-md-ref.scope=jakarta.inject.Singleton

# Optional scaffold fallback: a default BrokerAccountId the auth-headers factory uses to
# resolve a bearer when no per-request bearer was attached (MD2/MD3 resolve per linked
# account in production, so this stays unset). Declared here for CFG1; left unset (the
# config property is Optional<String>).
# quorumtrading.marketdata.saxo.default-account-id=${SAXO_DEFAULT_ACCOUNT_ID:}
