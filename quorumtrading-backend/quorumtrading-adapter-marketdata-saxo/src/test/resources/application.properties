# Saxo market-data adapter — test configuration (MD1)
#
# Isolated @QuarkusTest boot for the WireMock client harness. The saxo-openapi rest-client
# URL is overridden at runtime by SaxoOpenApiWireMockResource to the live WireMock port.

# Exclude application services/agents that need dependencies not available in this isolated
# adapter module (mirrors the finnhub adapter test setup).
quarkus.arc.exclude-types=ai.quorumtrading.application.orchestration.agents.TechnicalAgent,\
  ai.quorumtrading.application.orchestration.agents.FundamentalAgent,\
  ai.quorumtrading.application.orchestration.agents.SentimentAgent,\
  ai.quorumtrading.application.service.BrokerRouter,\
  ai.quorumtrading.application.service.MarketResearchOrchestrator,\
  ai.quorumtrading.application.service.ExecuteMarketResearchService

# Scaffold default-account fallback (see SaxoAuthHeadersFactory): with the test token
# provider present, this lets the real auth-headers factory resolve a bearer without
# per-request account context so the WireMock harness can assert the header flows.
quorumtrading.marketdata.saxo.default-account-id=00000000-0000-0000-0000-0000000000aa

# Enable the Saxo market-data adapter so coversInstrument()/fetch paths are live under test.
# All HTTP is stubbed by WireMock; no real Saxo gateway is ever contacted.
quorumtrading.marketdata.saxo.enabled=true

# Placeholders so the saxo-openapi / saxo-md-ref rest-client config keys resolve before the test
# resource overrides them with the WireMock URL. NEVER the real Saxo gateway.
quarkus.rest-client.saxo-openapi.url=http://localhost:1
quarkus.rest-client.saxo-md-ref.url=http://localhost:1
