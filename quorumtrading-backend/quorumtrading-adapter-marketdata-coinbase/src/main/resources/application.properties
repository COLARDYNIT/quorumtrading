# Coinbase Exchange Market Data REST Client configuration.
#
# NOTE: the `enabled` flag lives in
# quorumtrading-bootstrap/src/main/resources/application.properties to avoid config conflicts.
# KEYLESS public market data — no credentials are sent (a User-Agent header is set on the client).
quarkus.rest-client.coinbase-api.url=https://api.exchange.coinbase.com
quarkus.rest-client.coinbase-api.scope=jakarta.inject.Singleton
