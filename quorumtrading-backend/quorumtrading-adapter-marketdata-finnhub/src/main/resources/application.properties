# Finnhub REST Client Configuration
quarkus.rest-client.finnhub-api.url=https://finnhub.io
quarkus.rest-client.finnhub-api.scope=jakarta.inject.Singleton

# Finnhub Provider Configuration
# Get your free API key at: https://finnhub.io/dashboard
quorumtrading.providers.finnhub.api-key=${FINNHUB_API_KEY:not-configured}
quorumtrading.providers.finnhub.enabled=true
quorumtrading.providers.finnhub.symbols=AAPL,MSFT,GOOGL,AMZN,TSLA

# Logging
quarkus.log.category."ai.quorumtrading.adapter.marketdata.finnhub".level=INFO
