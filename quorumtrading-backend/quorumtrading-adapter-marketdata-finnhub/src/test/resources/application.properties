# Finnhub test configuration
# Exclude services and agents from market data adapter tests (they need dependencies not available in this module)
quarkus.arc.exclude-types=ai.quorumtrading.application.orchestration.agents.TechnicalAgent,\
  ai.quorumtrading.application.orchestration.agents.FundamentalAgent,\
  ai.quorumtrading.application.orchestration.agents.SentimentAgent,\
  ai.quorumtrading.application.service.BrokerRouter,\
  ai.quorumtrading.application.service.MarketResearchOrchestrator,\
  ai.quorumtrading.application.service.ExecuteMarketResearchService

# Finnhub API configuration for tests
# Use environment variable if available, otherwise use dummy value
quorumtrading.providers.finnhub.api-key=${FINNHUB_API_KEY:test-dummy-key}
quorumtrading.providers.finnhub.enabled=true
quorumtrading.providers.finnhub.symbols=AAPL,MSFT,GOOGL,AMZN,TSLA

# REST client configuration
quarkus.rest-client.finnhub-api.url=https://finnhub.io

# Auto-backtest configuration for tests
%test.quorumtrading.auto-backtest.period-weeks=1
%test.quorumtrading.auto-backtest.initial-cash=100000.0
