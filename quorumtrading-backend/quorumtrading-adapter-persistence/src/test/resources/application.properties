# Test profile uses separate test database to avoid polluting dev database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=quorumtrading
quarkus.datasource.password=dev-password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:55432/quorumtrading_test
quarkus.datasource.jdbc.max-size=10

# Hibernate
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=false

# Flyway - run migrations for test database to ensure clean schema
# Migrations are now owned by the persistence adapter module
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.clean-at-start=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."ai.quorumtrading".level=INFO

# Exclude agent beans from persistence tests (they need LLMPort which is not available in this module)
# Exclude BrokerRouter from persistence tests (it needs broker adapters which are not available in this module)
quarkus.arc.exclude-types=ai.quorumtrading.application.orchestration.agents.TechnicalAgent,ai.quorumtrading.application.orchestration.agents.FundamentalAgent,ai.quorumtrading.application.orchestration.agents.SentimentAgent,ai.quorumtrading.application.service.BrokerRouter

# Auto-backtest configuration for tests
%test.quorumtrading.auto-backtest.period-weeks=1
%test.quorumtrading.auto-backtest.initial-cash=100000.0

# Credential encryption key (required by CredentialEncryptor)
quorumtrading.credentials.encryption-key=deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
