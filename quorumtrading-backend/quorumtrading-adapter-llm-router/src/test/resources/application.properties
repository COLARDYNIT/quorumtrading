# Disable scheduled metrics logging during tests
quarkus.scheduler.enabled=false

# Router configuration for tests
quorumtrading.llm.router.provider-order=mock-a,mock-b
# Exclude services from tests that need dependencies not available in this adapter module
quarkus.arc.exclude-types=ai.quorumtrading.application.service.BrokerRouter,\
  ai.quorumtrading.application.service.MarketResearchOrchestrator,\
  ai.quorumtrading.application.service.ExecuteMarketResearchService

# Auto-backtest configuration for tests
%test.quorumtrading.auto-backtest.period-weeks=1
%test.quorumtrading.auto-backtest.initial-cash=100000.0
