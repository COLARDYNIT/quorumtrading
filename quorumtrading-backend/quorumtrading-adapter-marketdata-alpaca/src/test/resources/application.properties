# Exclude services from tests that need dependencies not available in this adapter module
quarkus.arc.exclude-types=ai.quorumtrading.application.service.BrokerRouter,\
  ai.quorumtrading.application.service.MarketResearchOrchestrator,\
  ai.quorumtrading.application.service.ExecuteMarketResearchService

# Alpaca Market Data Configuration (for integration tests)
quorumtrading.marketdata.alpaca.enabled=true
quorumtrading.broker.alpaca.api-key=${ALPACA_API_KEY:not-configured}
quorumtrading.broker.alpaca.api-secret=${ALPACA_API_SECRET:not-configured}
quorumtrading.broker.alpaca.base-url=https://paper-api.alpaca.markets
quorumtrading.marketdata.alpaca.api-key=${ALPACA_API_KEY:not-configured}
quorumtrading.marketdata.alpaca.api-secret=${ALPACA_API_SECRET:not-configured}
quorumtrading.marketdata.alpaca.base-url=${ALPACA_MARKETDATA_BASE_URL:https://data.alpaca.markets}
quorumtrading.marketdata.alpaca.stock-feed=${ALPACA_STOCK_FEED:iex}
quorumtrading.marketdata.alpaca.stock-symbols=AAPL,MSFT,TSLA,NVDA,AMD,PLTR,COIN,SPY,QQQ,GME,AMC
quorumtrading.marketdata.alpaca.crypto-symbols=BTC,ETH,SOL,DOGE,LTC,ADA,XRP

# Test database configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=quorumtrading
quarkus.datasource.password=dev-password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:55432/quorumtrading_test

# Auto-backtest configuration for tests
%test.quorumtrading.auto-backtest.period-weeks=1
%test.quorumtrading.auto-backtest.initial-cash=100000.0
