# Alpaca Market Data API REST Client Configuration

# NOTE: Alpaca configuration (api-key, api-secret, enabled, base-url) is defined in
# quorumtrading-bootstrap/src/main/resources/application.properties to avoid config conflicts.
# Module-specific properties would override bootstrap properties, causing issues.

# REST Client configuration
quarkus.rest-client.alpaca-market-data.url=${quorumtrading.marketdata.alpaca.base-url}
quarkus.rest-client.alpaca-market-data.scope=jakarta.inject.Singleton
# Note: Headers are registered via @RegisterClientHeaders annotation on the client interface
