# Saxo broker adapter — test configuration (SB2 + OA2 WireMock harnesses)
#
# Isolated @QuarkusTest boot. Placeholder rest-client URLs let the saxo-* rest-client config keys
# resolve before the per-test WireMock resource overrides the one it stubs:
#   - SaxoTokenEndpointClientWireMockTest  → overrides saxo-oauth.url
#   - SaxoBrokerAuthAccountKeyWireMockTest → overrides saxo-trading.url
quarkus.rest-client.saxo-oauth.url=http://localhost:1
quarkus.rest-client.saxo-trading.url=http://localhost:1
quarkus.rest-client.saxo-ref.url=http://localhost:1
