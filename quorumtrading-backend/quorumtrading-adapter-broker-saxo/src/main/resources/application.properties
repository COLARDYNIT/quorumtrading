# Saxo Bank (EU) Broker Adapter — REST client configuration (SB1 scaffold)
#
# Default OFF. These declare the config keys the Saxo trade + reference-data REST
# clients need; CFG1-config-keys (Wave 3, bootstrap/application.properties) is the
# authoritative owner of the real per-environment values, flags, and %test
# overrides. Non-empty placeholders are used so Quarkus string-config validation
# does not fail when nothing is set (per project rule).
#
# Saxo is reached only per linked BrokerAccount (SAXO_SIM / SAXO_LIVE), never via a
# global broker-type config string — OAuth creds are inherently per-account.

# Feature flag (default OFF until the Go-Live promotion sequence is walked)
quorumtrading.broker.saxo.enabled=${SAXO_ENABLED:false}

# Certificate-based (CBA) auth — PERMANENTLY DISABLED for retail. Saxo offers CBA to INSTITUTIONAL
# PARTNERS ONLY; retail/direct clients cannot use it (SAXO_ANSWERS §1.2). The retail path relies
# solely on the rotating single-use refresh-token OAuth model. While this gate is false the
# cert-grant path (SaxoCertificateOAuthClient.exchangeCertificate) throws a clear "certificate auth
# not enabled / partner-gated" error and performs no token exchange. Flip it only if Saxo ever
# grants this app institutional CBA eligibility (not expected for retail) — OA6-cert-stub boundary.
quorumtrading.broker.saxo.cert.enabled=${SAXO_CERT_ENABLED:false}

# Saxo OpenApi base URLs. SIM gateway by default; LIVE selected per account env.
# TODO(CFG1): confirm the exact SIM/LIVE gateway hosts and split base paths.
quorumtrading.broker.saxo.base-url-sim=${SAXO_BASE_URL_SIM:https://gateway.saxobank.com/sim/openapi}
quorumtrading.broker.saxo.base-url-live=${SAXO_BASE_URL_LIVE:https://gateway.saxobank.com/openapi}

# REST client: trade/account surface (/port/v1). Bearer added via @RegisterClientHeaders.
quarkus.rest-client.saxo-trading.url=${quorumtrading.broker.saxo.base-url-sim}
quarkus.rest-client.saxo-trading.scope=jakarta.inject.Singleton

# REST client: reference-data surface (/ref/v1) for Symbol -> Uic resolution.
quarkus.rest-client.saxo-ref.url=${quorumtrading.broker.saxo.base-url-sim}
quarkus.rest-client.saxo-ref.scope=jakarta.inject.Singleton

# OAuth2 token endpoint (RFC-6749). Used by SaxoTokenEndpointClient for the
# authorization-code exchange and the rotating refresh-token grant. Confidential client:
# the call authenticates with HTTP Basic (client_id:client_secret), not form fields
# (SAXO_ANSWERS §1.5). Configurable URL (CFG1 owns the real per-environment value);
# non-empty placeholder so Quarkus string config validation does not fail when nothing is set.
#   SIM : https://sim.logonvalidation.net/token
#   LIVE: https://live.logonvalidation.net/token   (⚠️ confirm exact LIVE string)
# TODO(Saxo): the rest-client binds the SIM token URL; a per-environment SIM/LIVE token-host
# split is still open (SAXO_ANSWERS §1.5 ⚠️).
quorumtrading.broker.saxo.token-url=${SAXO_TOKEN_URL:https://sim.logonvalidation.net/token}
quorumtrading.broker.saxo.token-url-sim=${SAXO_TOKEN_URL_SIM:https://sim.logonvalidation.net/token}
quorumtrading.broker.saxo.token-url-live=${SAXO_TOKEN_URL_LIVE:https://live.logonvalidation.net/token}
quarkus.rest-client.saxo-oauth.url=${quorumtrading.broker.saxo.token-url}
quarkus.rest-client.saxo-oauth.scope=jakarta.inject.Singleton

# Platform-level Saxo OpenAPI app credentials (client_id / client_secret). The confidential
# token call sends them as an HTTP Basic Authorization header (SAXO_ANSWERS §1.5), NOT as form
# fields. CFG1/CFG3 supply the real values via SAXO_APP_KEY / SAXO_APP_SECRET; non-empty
# placeholders keep config validation green while Saxo is OFF.
quorumtrading.broker.saxo.app-key=${SAXO_APP_KEY:not-configured}
quorumtrading.broker.saxo.app-secret=${SAXO_APP_SECRET:not-configured}
