# CLA Assistant (self-hosted action — signatures stored in this repo, no third-party service).
#
# A contributor opening their first PR is asked to comment the sign-off sentence below; the action
# records it in signatures/version1/cla.json on the `cla-signatures` branch and sets the PR status
# to passing. Re-runs on later PRs recognise an existing signature.
#
# TWO MANUAL SETUP STEPS (cannot be scripted — repo/account settings):
#   1. Create a Personal Access Token (classic: `repo` scope, or fine-grained: Contents + Pull
#      requests read/write on this repo) and add it as repo secret PERSONAL_ACCESS_TOKEN.
#      Needed so the action can commit the signatures file.
#   2. If the repo is renamed / fresh-inited under a new slug, update `path-to-document` below.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event.comment.body == 'recheck'
          || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
          || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/COLARDYNIT/quorumtrading/blob/main/CLA.md'
          branch: 'cla-signatures'
          # The maintainer is the "Us" party of the CLA and does not sign it.
          allowlist: 'frederikcolardyn,dependabot[bot],github-actions[bot]'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the Contributor License Agreement.'
